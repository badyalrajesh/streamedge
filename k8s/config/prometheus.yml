global:
  scrape_interval: 5s
  scrape_timeout: 4s

scrape_configs:
  - job_name: haproxy
    static_configs:
      - targets: ["lb:8404"]

  # Find every edge pod through the headless service, and scrape the
  # exporter container in each one
  - job_name: varnish
    dns_sd_configs:
      - names: ["edge.streamedge.svc.cluster.local"]
        type: A
        port: 9100
    relabel_configs:
      - source_labels: [__address__]
        regex: "(.*):9100"
        target_label: edge
        replacement: "$1"
