services:
  origin:
    image: nginx:1.27-alpine
    ports:
      - "8081:80"
    volumes:
      - ./origin/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./origin/www:/usr/share/nginx/html:ro

  edge:
    image: varnish:7.5
    ports:
      - "8080:80"
    volumes:
      - ./edge/default.vcl:/etc/varnish/default.vcl:ro
    depends_on:
      - origin
